# Pipeline test (before any fine-tuning data is recorded): the BLUE object goes onto AprilTag 19 and the GREEN object onto AprilTag 25
# (red objects are ignored). It runs exactly until every blue and green object is on its tag, retrying failed picks. Nothing is
# recorded. The tag ids and names come from pick_place_test.launch.py (targets:=...); the names must match color_targets below. Procedure: docs/finetuning_procedure.md, section 6.
#
#   ros2 run custom_package scripted_demo --ros-args --params-file \
#       $(ros2 pkg prefix custom_package)/share/custom_package/config/pick_place_test.yaml
#
# Values marked (measure) must match your setup; the rest are safe defaults for a first test.
scripted_demo:
  ros__parameters:
    record: false                     # trial mode: run the motions and the checks, record nothing
    confirm: true                     # print every plan first: ENTER = execute, s = skip (nothing moves), q = quit
    # Clear the table: count the objects at the first look and keep going until every one is on the marker. A failed pick
    # (nothing grasped, or the object not on the marker afterwards) is simply retried on the next round, up to
    # max_attempts_per_object per object, and objects x max_attempts in total, so a bad object can't loop forever.
    until_clear: true
    max_attempts_per_object: 3
    episodes: 0                       # 0 = no extra limit

    # What to pick and where to put it
    colors: ["blue", "green"]         # YOLO classes that are picked (red is left alone); picked in random order
    color_targets: ["blue:blue marker", "green:green marker"]   # "<colour>:<target name>", names from the launch file's targets
    prompt_template: "pick up the {color} object and place it on the {target}"
    # Placing ON a marker: the fingertip is lowered to cube_size/2 + release_clearance above the table (bin_height 0),
    # i.e. the object is released ~2.5 mm above the paper. Each placement lands at the next offset around the tag centre
    # (flat list of dx, dy in metres, counted per tag), so objects of one colour don't land on each other. A tag is covered by
    # the first object placed on it: remember_targets keeps using its last seen position.
    bin_height: 0.0
    release_clearance: 0.015
    place_offsets: [0.0, 0.0,  0.05, 0.0,  -0.05, 0.0,  0.0, 0.05,  0.0, -0.05]
    remember_targets: true
    target_radius: 0.08               # an object within 8 cm of ITS tag counts as "already placed" and is not picked again

    # Scene (measure)
    table_z: -0.07                      # m, table surface in the robot frame (the average tag height calibrate_camera printed)
    cube_size: 0.025                  # m, edge of the objects (object_detector.yaml: object_size)
    workspace_x: [0.08, 0.30]         # m in front of the base; objects outside are ignored
    workspace_y: [-0.22, 0.22]

    # Motion: slow first. Raise only after the first successful runs (default [0.5, 0.3, 0.6, 0.8]).
    max_joint_vel: [0.3, 0.2, 0.4, 0.5]
    variation: false                  # no random variations in a test: the same situation gives the same motion
    max_pitch_deg: 90.0
    min_pitch_deg: 30.0

    # Checks. The grasp check needs grasp_closed_threshold (measure: close the gripper on nothing and on an object, read
    # gripper_left_joint, put the threshold between the two). Mock hardware always closes fully: set check_grasp false there.
    check_grasp: true
    grasp_closed_threshold: -0.007
    check_place: true
    gripper_max_effort: 1.0
